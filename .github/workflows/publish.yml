name: Publish to RubyGems

# Publishes with RubyGems trusted publishing: rubygems.org accepts the push only from this
# workflow in this repository, verified through GitHub's OIDC identity. No API key is stored.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.2"

      - name: Build gem
        run: gem build bugstack.gemspec

      - name: Get a short-lived RubyGems credential
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems
        run: gem push bugstack-*.gem
